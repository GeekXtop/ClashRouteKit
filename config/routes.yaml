publishBaseUrl: http://127.0.0.1:8787
defaults:
  proxyGroups:
    healthCheck:
      url: https://cp.cloudflare.com/generate_204
      interval: 300
      timeout: 5
    urlTest:
      tolerance: 50
  ruleSets:
    ruleProviderInterval: 28800
    geoipNoResolve: true
template:
  output: Custom_Clash.ini
vendorRepos:
  - name: domain-list-community
    url: https://github.com/v2fly/domain-list-community.git
    path: vendor/domain-list-community
    catalog:
      dir: vendor/domain-list-community/data
      kind: domain-list
  - name: ACL4SSR
    url: https://github.com/ACL4SSR/ACL4SSR.git
    path: vendor/ACL4SSR
    catalog:
      dir: vendor/ACL4SSR/Clash
      kind: list-dir
    templateDir: vendor/ACL4SSR/Clash/config
  - name: dler-io
    url: https://github.com/dler-io/Rules.git
    path: vendor/dler-io
    branch: main
    catalog:
      dir: vendor/dler-io/Clash/Provider
      kind: provider-yaml
  - name: Aethersailor
    url: https://github.com/Aethersailor/Custom_OpenClash_Rules.git
    path: vendor/Aethersailor
    branch: main
    catalog:
      dir: vendor/Aethersailor/rule
      kind: list-dir
    templateDir: vendor/Aethersailor/cfg
customProxyGroups:
  - name: 🚀 手动选择
