publishBaseUrl: http://127.0.0.1:8787
template:
  output: Custom_Clash.ini
vendorRepos:
  - name: domain-list-community
    url: https://github.com/v2fly/domain-list-community.git
    path: vendor/domain-list-community
  - name: ACL4SSR
    url: https://github.com/ACL4SSR/ACL4SSR.git
    path: vendor/ACL4SSR
  - name: dler-io
    url: https://github.com/dler-io/Rules.git
    path: vendor/Rules
  - name: Aethersailor
    url: https://github.com/Aethersailor/Custom_OpenClash_Rules.git
    path: vendor/Custom_OpenClash_Rules
    branch: main
customProxyGroups:
  - name: Proxy
    type: select
    options:
      - Auto
      - Direct
    nodeFilters:
      - .*
  - name: Auto
    type: url-test
    options: []
    nodeFilters:
      - .*
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
  - name: AI
    type: select
    options:
      - Proxy
      - Auto
      - Direct
  - name: Tech
    type: select
    options:
      - Proxy
      - Auto
      - Direct
  - name: Crypto
    type: select
    options:
      - Proxy
      - Auto
      - Direct
  - name: Microsoft
    type: select
    options:
      - Proxy
      - Auto
      - Direct
  - name: Streaming
    type: select
    options:
      - Proxy
      - Auto
      - Direct
  - name: Games
    type: select
    options:
      - Proxy
      - Auto
      - Direct
  - name: 🐟 漏网之鱼
    type: select
    options:
      - Proxy
      - Direct
      - Auto
    nodeFilters:
      - .*
  - name: Direct
    type: select
    options:
      - DIRECT
ruleSets:
  - id: private-geosite-private
    policy: Direct
    source:
      type: geosite
      value: private
  - id: custom-direct-provider-custom-direct-domain
    policy: Direct
    source:
      type: rule-provider
      behavior: domain
      file: Custom_Direct_Domain.yaml
  - id: custom-proxy-provider-custom-proxy-domain
    policy: Proxy
    source:
      type: rule-provider
      behavior: domain
      file: Custom_Proxy_Domain.yaml
  - id: ai-provider-ai-domain
    policy: AI
    source:
      type: rule-provider
      behavior: domain
      file: AI_Domain.yaml
  - id: ai-geosite-openai
    policy: AI
    source:
      type: geosite
      value: openai
  - id: ai-geosite-anthropic
    policy: AI
    source:
      type: geosite
      value: anthropic
  - id: ai-geosite-google-gemini
    policy: AI
    source:
      type: geosite
      value: google-gemini
  - id: ai-geosite-google-deepmind
    policy: AI
    source:
      type: geosite
      value: google-deepmind
  - id: ai-geosite-jetbrains-ai
    policy: AI
    source:
      type: geosite
      value: jetbrains-ai
  - id: ai-geosite-github-copilot
    policy: AI
    source:
      type: geosite
      value: github-copilot
  - id: developer-provider-developer-domain
    policy: Tech
    source:
      type: rule-provider
      behavior: domain
      file: Developer_Domain.yaml
  - id: developer-geosite-github
    policy: Tech
    source:
      type: geosite
      value: github
  - id: developer-geosite-gitlab
    policy: Tech
    source:
      type: geosite
      value: gitlab
  - id: developer-geosite-npmjs
    policy: Tech
    source:
      type: geosite
      value: npmjs
  - id: developer-geosite-nodejs
    policy: Tech
    source:
      type: geosite
      value: nodejs
  - id: developer-geosite-docker
    policy: Tech
    source:
      type: geosite
      value: docker
  - id: developer-geosite-debian
    policy: Tech
    source:
      type: geosite
      value: debian
  - id: developer-geosite-ubuntu
    policy: Tech
    source:
      type: geosite
      value: ubuntu
  - id: developer-geosite-python
    policy: Tech
    source:
      type: geosite
      value: python
  - id: developer-geosite-golang
    policy: Tech
    source:
      type: geosite
      value: golang
  - id: developer-geosite-rust
    policy: Tech
    source:
      type: geosite
      value: rust
  - id: developer-geosite-jetbrains
    policy: Tech
    source:
      type: geosite
      value: jetbrains
  - id: developer-geosite-sourceforge
    policy: Tech
    source:
      type: geosite
      value: sourceforge
  - id: crypto-provider-crypto-domain
    policy: Crypto
    source:
      type: rule-provider
      behavior: domain
      file: Crypto_Domain.yaml
  - id: crypto-geosite-binance
    policy: Crypto
    source:
      type: geosite
      value: binance
  - id: crypto-geosite-okx
    policy: Crypto
    source:
      type: geosite
      value: okx
  - id: crypto-geosite-bybit
    policy: Crypto
    source:
      type: geosite
      value: bybit
  - id: microsoft-provider-microsoft-domain
    policy: Microsoft
    source:
      type: rule-provider
      behavior: domain
      file: Microsoft_Domain.yaml
  - id: microsoft-geosite-microsoft-dev
    policy: Microsoft
    source:
      type: geosite
      value: microsoft-dev
  - id: microsoft-geosite-microsoft
    policy: Microsoft
    source:
      type: geosite
      value: microsoft
  - id: streaming-geosite-youtube
    enabled: false
    policy: Streaming
    source:
      type: geosite
      value: youtube
  - id: streaming-geosite-netflix
    enabled: false
    policy: Streaming
    source:
      type: geosite
      value: netflix
  - id: streaming-geosite-disney
    enabled: false
    policy: Streaming
    source:
      type: geosite
      value: disney
  - id: games-geosite-steam
    enabled: false
    policy: Games
    source:
      type: geosite
      value: steam
  - id: games-geosite-epicgames
    enabled: false
    policy: Games
    source:
      type: geosite
      value: epicgames
  - id: global-proxy-geosite-geolocation-not-cn
    policy: Proxy
    source:
      type: geosite
      value: geolocation-!cn
  - id: china-geosite-geolocation-cn
    policy: Direct
    source:
      type: geosite
      value: geolocation-cn
  - id: china-geosite-cn
    policy: Direct
    source:
      type: geosite
      value: cn
  - id: china-geoip-cn
    policy: Direct
    source:
      type: geoip
      value: cn
      noResolve: true
  - id: final
    policy: 🐟 漏网之鱼
    source:
      type: final
ruleProviders:
  - name: Custom_Direct
    output: Custom_Direct_Domain.yaml
    behavior: domain
    sources:
      - name: LocalDirect
        type: clash-list
        path: config/rules/Custom_Direct_Domain.list
  - name: Custom_Proxy
    output: Custom_Proxy_Domain.yaml
    behavior: domain
    sources:
      - name: LocalProxy
        type: clash-list
        path: config/rules/Custom_Proxy_Domain.list
  - name: AI
    output: AI_Domain.yaml
    behavior: domain
    sources:
      - name: DlerRules_AI_Suite
        type: clash-provider
        basePath: vendor/Rules
        path: Clash/Provider/AI Suite.yaml
      - name: DLC_openai
        type: domain-list-community
        entry: openai
        basePath: vendor/domain-list-community/data
      - name: DLC_anthropic
        type: domain-list-community
        entry: anthropic
        basePath: vendor/domain-list-community/data
      - name: DLC_google_gemini
        type: domain-list-community
        entry: google-gemini
        basePath: vendor/domain-list-community/data
      - name: DLC_google_deepmind
        type: domain-list-community
        entry: google-deepmind
        basePath: vendor/domain-list-community/data
      - name: DLC_jetbrains_ai
        type: domain-list-community
        entry: jetbrains-ai
        basePath: vendor/domain-list-community/data
      - name: DLC_github_copilot
        type: domain-list-community
        entry: github-copilot
        basePath: vendor/domain-list-community/data
  - name: Developer
    output: Developer_Domain.yaml
    behavior: domain
    sources:
      - name: LocalDeveloper
        type: clash-list
        path: config/rules/Developer_Domain.list
      - name: ACL4SSR_Developer
        type: clash-list
        basePath: vendor/ACL4SSR
        path: Clash/Ruleset/Developer.list
      - name: DLC_github
        type: domain-list-community
        entry: github
        basePath: vendor/domain-list-community/data
      - name: DLC_gitlab
        type: domain-list-community
        entry: gitlab
        basePath: vendor/domain-list-community/data
      - name: DLC_npmjs
        type: domain-list-community
        entry: npmjs
        basePath: vendor/domain-list-community/data
      - name: DLC_nodejs
        type: domain-list-community
        entry: nodejs
        basePath: vendor/domain-list-community/data
      - name: DLC_docker
        type: domain-list-community
        entry: docker
        basePath: vendor/domain-list-community/data
      - name: DLC_debian
        type: domain-list-community
        entry: debian
        basePath: vendor/domain-list-community/data
      - name: DLC_ubuntu
        type: domain-list-community
        entry: ubuntu
        basePath: vendor/domain-list-community/data
      - name: DLC_python
        type: domain-list-community
        entry: python
        basePath: vendor/domain-list-community/data
      - name: DLC_golang
        type: domain-list-community
        entry: golang
        basePath: vendor/domain-list-community/data
      - name: DLC_rust
        type: domain-list-community
        entry: rust
        basePath: vendor/domain-list-community/data
      - name: DLC_jetbrains
        type: domain-list-community
        entry: jetbrains
        basePath: vendor/domain-list-community/data
      - name: DLC_sourceforge
        type: domain-list-community
        entry: sourceforge
        basePath: vendor/domain-list-community/data
  - name: Crypto
    output: Crypto_Domain.yaml
    behavior: domain
    sources:
      - name: DlerRules_Crypto
        type: clash-provider
        basePath: vendor/Rules
        path: Clash/Provider/Crypto.yaml
      - name: DLC_binance
        type: domain-list-community
        entry: binance
        basePath: vendor/domain-list-community/data
      - name: DLC_okx
        type: domain-list-community
        entry: okx
        basePath: vendor/domain-list-community/data
      - name: DLC_bybit
        type: domain-list-community
        entry: bybit
        basePath: vendor/domain-list-community/data
  - name: Microsoft
    output: Microsoft_Domain.yaml
    behavior: domain
    sources:
      - name: DlerRules_Microsoft
        type: clash-provider
        basePath: vendor/Rules
        path: Clash/Provider/Microsoft.yaml
      - name: DLC_microsoft_dev
        type: domain-list-community
        entry: microsoft-dev
        basePath: vendor/domain-list-community/data
      - name: DLC_microsoft
        type: domain-list-community
        entry: microsoft
        basePath: vendor/domain-list-community/data
